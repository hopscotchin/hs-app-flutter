meta:
  bitrise.io:
    stack: linux-docker-android-22.04
app:
  envs:
    - opts:
        is_expand: false
      GRADLE_BUILD_FILE_PATH: build.gradle
    - opts:
        is_expand: false
      GRADLE_TASK: assembleDebug
    - opts:
        is_expand: false
      GRADLEW_PATH: "./gradlew"
    - TEST_FAIRY_API_KEY: 1f06e0bc8a717cb882ef700470ad978db98fb6b7
    - ANDROID_MAIL: Hopscotch-Android
    - NODE_VERSION: 16.13.0
    - NPM_VERSION: 7.20.3
    - _JAVA_OPTIONS: "-Xms1024m -Xmx3072m"
    - GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError"
    - FIREBASE_APP_ID: 1:722884108401:android:698499a3312099ba
    - TEST_GROUPS: app-devs, qa-team, product
    - opts:
        is_expand: false
      GRADLE_BUILD_TASK_BUNDLE: bundleDebug
