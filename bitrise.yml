---
format_version: 1.2.0
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
workflows:
  bundle:
    steps:
      - activate-ssh-key:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - change-workdir:
          inputs:
            - path: "$REACT_NATIVE_WORKING_DIRECTORY"
          title: Switch to hs-app-rn directory
      - git-clone:
          inputs:
            - repository_url: "$REACT_NATIVE_GIT_URL"
          title: Clone react native (hs-app-rn) repository
      - nvm:
          inputs:
            - node_version: "$NODE_VERSION"
          title: Install nvm and nodejs
      - script:
          inputs:
            - working_dir: ''
            - is_debug: 'yes'
            - content: |-
                #!/usr/bin/env bash
                # fail if any commands fails
                chmod a+x post-npm-install.sh
          title: Give permissions to post-npm-install script
      - npm:
          inputs:
            - command: install -g react-native-cli
          title: Install react-native-cli
      - npm:
          inputs:
            - workdir: "$REACT_NATIVE_WORKING_DIRECTORY"
            - command: install
          title: Run npm install
      - change-workdir:
          inputs:
            - path: "$ANDROID_WORKING_DIRECTORY"
          title: Change directory to clone android repo
      - set-java-version@1:
          inputs:
            - set_java_version: 17
      - git-clone:
          title: Clone Android Repository
      - change-workdir:
          inputs:
            - path: "$REACT_NATIVE_WORKING_DIRECTORY"
          title: Change working directory to hs-app-rn
      - script:
          inputs:
            - content: |-
                #!/usr/bin/env bash
                # fail if any commands fails
                react-native bundle --platform android --dev true  --entry-file index.js --bundle-output ../hs-app-android/hsapp/src/main/assets/index.android.bundle --assets-dest ../hs-app-android/hsapp/src/main/res
          title: Run react native bundle command
      - change-workdir:
          inputs:
            - path: "$ANDROID_WORKING_DIRECTORY"
          title: Change Working Directory back to hs-app-android
      - gradle-runner:
          inputs:
            - gradle_task: "$GRADLE_BUILD_TASK"
          title: Gradle Runner with assembleBundle
      - gradle-runner:
          inputs:
            - gradle_task: "$GRADLE_BUILD_TASK_BUNDLE"
          title: Gradle Runner with bundleDebug
      - deploy-to-bitrise-io: {}
      - firebase-app-distribution:
          inputs:
            - app_path: "$BUNDLE_PATH"
            - app: "$FIREBASE_APP_ID"
            - testers: "$TEST_GROUPS"
            - groups: "$TEST_GROUP_APP_DEVS$TEST_GROUPS"
            - release_notes_file: "$BITRISE_GIT_COMMIT"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
          title: Firebase Deployment - BUNDLE
      - firebase-app-distribution:
          inputs:
            - app_path: "$APK_ARM"
            - app: "$FIREBASE_APP_ID"
            - testers: ''
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
          title: Firebase Deployment - ARM
      - firebase-app-distribution:
          inputs:
            - app_path: "$APK_ARM_64"
            - app: "$FIREBASE_APP_ID"
            - testers: ''
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
          title: Firebase Deployment - ARM_64
      - firebase-app-distribution:
          inputs:
            - app_path: "$APK_x86"
            - app: "$FIREBASE_APP_ID"
            - testers: ''
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
          title: Firebase Deployment - x86
      - firebase-app-distribution:
          inputs:
            - app_path: "$APK_x86_64"
            - app: "$FIREBASE_APP_ID"
            - testers: ''
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
          title: Firebase Deployment - x86_64
    envs:
      - REACT_NATIVE_GIT_URL: git@github.com:hopscotchin/hs-app-rn.git
      - REACT_NATIVE_WORKING_DIRECTORY: "/bitrise/src/hs-app-rn"
      - ANDROID_WORKING_DIRECTORY: "/bitrise/src/hs-app-android"
      - GRADLE_BUILD_TASK: assembleBundle
      - APK_x86: "/bitrise/deploy/hsapp-x86-bundle.apk"
      - APK_ARM: "/bitrise/deploy/hsapp-armeabi-v7a-bundle.apk"
      - APK_ARM_64: "/bitrise/deploy/hsapp-arm64-v8a-bundle.apk"
      - APK_x86_64: "/bitrise/deploy/hsapp-x86_64-bundle.apk"
      - opts:
          is_expand: false
        GRADLE_BUILD_TASK_BUNDLE: bundleBundle
      - opts:
          is_expand: false
        BUNDLE_PATH: "/bitrise/deploy/hsapp-bundle.aab"
