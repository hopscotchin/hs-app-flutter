format_version: '26'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: flutter

workflows:
  _setup:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - file-downloader@1:
          title: Download .env from Bitrise Generic File Storage
          inputs:
            - source: "$BITRISEIO_ENV_FILE_URL"
            - destination: "$BITRISE_SOURCE_DIR/.env"
      - flutter-installer@1:
          inputs:
            - version: "$FLUTTER_VERSION"

  bundle_android:
    description: Debug APK (universal) + AAB, deployed to Firebase App Distribution.
    before_run:
      - _setup
    steps:
      - set-java-version@1:
          inputs:
            - set_java_version: 21
      - flutter-build@0:
          title: Build debug APK (universal)
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
            - platform: android
            - android_output_type: apk
            - android_additional_params: "--debug"
      - firebase-app-distribution@0:
          title: Firebase Deployment - Debug APK
          inputs:
            - app_path: "$BITRISE_APK_PATH"
            - app: "$FIREBASE_ANDROID_APP_ID"
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - flutter-build@0:
          title: Build debug AAB
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
            - platform: android
            - android_output_type: appbundle
            - android_additional_params: "--debug"
      - firebase-app-distribution@0:
          title: Firebase Deployment - Debug AAB
          inputs:
            - app_path: "$BITRISE_AAB_PATH"
            - app: "$FIREBASE_ANDROID_APP_ID"
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - deploy-to-bitrise-io@2: {}

  release_android:
    description: Release APK (universal) + AAB, deployed to Firebase App Distribution.
    before_run:
      - _setup
    steps:
      - set-java-version@1:
          inputs:
            - set_java_version: 18
      - flutter-build@0:
          title: Build release APK (universal)
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
            - platform: android
            - android_output_type: apk
      - firebase-app-distribution@0:
          title: Firebase Deployment - Release APK
          inputs:
            - app_path: "$BITRISE_APK_PATH"
            - app: "$FIREBASE_ANDROID_APP_ID"
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - flutter-build@0:
          title: Build release AAB
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
            - platform: android
            - android_output_type: appbundle
      - firebase-app-distribution@0:
          title: Firebase Deployment - Release AAB
          inputs:
            - app_path: "$BITRISE_AAB_PATH"
            - app: "$FIREBASE_ANDROID_APP_ID"
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - deploy-to-bitrise-io@2: {}

  bundle_iOS:
    description: Debug iOS build (dev-signed), deployed to Firebase App Distribution.
    before_run:
      - _setup
    steps:
      - certificate-and-profile-installer@1: {}
      - flutter-build@0:
          title: Build debug IPA
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
            - platform: ios
            - ios_output_type: archive
            - ios_additional_params: "--debug --export-method development"
      - firebase-app-distribution@0:
          title: Firebase Deployment - Debug IPA
          inputs:
            - app_path: "$BITRISE_IPA_PATH"
            - app: "$FIREBASE_IOS_APP_ID"
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - deploy-to-bitrise-io@2: {}

  release_iOS:
    description: Release iOS archive, deployed to Firebase App Distribution.
    before_run:
      - _setup
    steps:
      - certificate-and-profile-installer@1: {}
      - flutter-build@0:
          title: Build release IPA
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
            - platform: ios
            - ios_output_type: archive
      - firebase-app-distribution@0:
          title: Firebase Deployment - Release IPA
          inputs:
            - app_path: "$BITRISE_IPA_PATH"
            - app: "$FIREBASE_IOS_APP_ID"
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - deploy-to-bitrise-io@2: {}

  run_tests:
    description: Runs flutter analyze + tests on push to develop and all PRs.
    steps:
      - git-clone@8: {}
      - flutter-installer@1:
          inputs:
            - version: "$FLUTTER_VERSION"
      - restore-dart-cache@3: {}
      - flutter-analyze@0:
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
      - flutter-test@1:
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
      - save-dart-cache@1: {}
      - deploy-to-bitrise-io@2: {}
    triggers:
      push:
        - branch: develop
      pull_request:
        - source_branch: "*"

meta:
  bitrise.io:
    stack: osx-xcode-26.6.x
    machine_type_id: g2.mac.large

app:
  envs:
    - opts:
        is_expand: false
      BITRISE_FLUTTER_PROJECT_LOCATION: "."
    - opts:
        is_expand: false
      FLUTTER_VERSION: 3.44.8
    - opts:
        is_expand: false
      FIREBASE_ANDROID_APP_ID: "1:645600819281:android:e618ecc14b4118c849a070"
    - opts:
        is_expand: false
      FIREBASE_IOS_APP_ID: "1:645600819281:ios:c1c6acb94446b90249a070"
    - opts:
        is_expand: false
      TEST_GROUPS: "app-devs, qa, product"
    - opts:
        is_expand: false
      _JAVA_OPTIONS: "-Xms1024m -Xmx3072m"
    - opts:
        is_expand: false
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError\""
