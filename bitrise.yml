format_version: '26'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: flutter
workflows:
  _setup:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - file-downloader@1:
          title: Download .env from Bitrise Generic File Storage
          inputs:
            - source: "$BITRISEIO_ENV_FILE_URL"
            - destination: "$BITRISE_SOURCE_DIR/.env"
      - flutter-installer@1:
          inputs:
            - version: "$FLUTTER_VERSION"
      - script:
          title: Compute dynamic build number (YYYYMMDD + run%100)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex
                DATE=$(date +%Y%m%d)
                SUFFIX=$(printf '%02d' $((BITRISE_BUILD_NUMBER % 100)))
                FLUTTER_BUILD_NUM="${DATE}${SUFFIX}"
                echo "FLUTTER_BUILD_NUM=$FLUTTER_BUILD_NUM"
                envman add --key FLUTTER_BUILD_NUM --value "$FLUTTER_BUILD_NUM"
  _test:
    before_run:
      - _setup
    steps: [ ]
      # ponytail: tests disabled for the deploy variants. Uncomment to re-enable
      # analyze + test gating on bundle_*/release_* runs. run_tests workflow
      # still runs these on PR + develop pushes independently.
      # - flutter-analyze@0:
      #     inputs:
    #       - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
    # - flutter-test@1:
    #     inputs:
    #       - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"

  _deploy_android_debug:
    steps:
      - set-java-version@1:
          inputs:
            - set_java_version: 21
      - flutter-build@0:
          title: Build debug APK (universal)
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
            - platform: android
            - android_output_type: apk
            - android_additional_params: "--debug --build-number=$FLUTTER_BUILD_NUM"
      - firebase-app-distribution@0:
          title: Firebase Deployment - Debug APK
          inputs:
            - app_path: "$BITRISE_APK_PATH"
            - app: "$FIREBASE_ANDROID_APP_ID"
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      # ponytail: AAB distribution disabled — Firebase App Distribution needs
      # Play Store integration linked for the hs-app-flutter project. Re-enable
      # once Firebase Console → Integrations → Google Play is set up.
      # - flutter-build@0:
      #     title: Build debug AAB
      #     inputs:
      #       - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
      #       - platform: android
      #       - android_output_type: appbundle
      #       - android_additional_params: "--debug"
      # - firebase-app-distribution@0:
      #     title: Firebase Deployment - Debug AAB
      #     inputs:
      #       - app_path: "$BITRISE_AAB_PATH"
      #       - app: "$FIREBASE_ANDROID_APP_ID"
      #       - groups: "$TEST_GROUPS"
      #       - release_notes: "$BITRISE_GIT_MESSAGE"
      #       - firebase_token: "$FIREBASE_TOKEN"
      - deploy-to-bitrise-io@2: { }

  _deploy_ios_debug:
    steps:
      - script:
          title: flutter pub get + iOS config prep
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex
                flutter pub get
                dart pub global activate flutterfire_cli
                envman add --key PATH --value "$HOME/.pub-cache/bin:$PATH"
                flutter build ios --config-only --profile --build-number=$FLUTTER_BUILD_NUM
      - manage-ios-code-signing@2:
          inputs:
            - distribution_method: development
            - apple_service_connection: api-key
            - project_path: "./ios/Runner.xcworkspace"
            - scheme: Runner
      - xcode-archive@5:
          inputs:
            - project_path: "./ios/Runner.xcworkspace"
            - scheme: Runner
            - configuration: Profile
            - distribution_method: development
            - automatic_code_signing: api-key
      - script:
          title: Upload dSYMs to Firebase Crashlytics
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex
                GSP="$BITRISE_SOURCE_DIR/ios/Runner/GoogleService-Info.plist"
                # upload-symbols ships in either the Pods dir or the SwiftPM checkout under DerivedData.
                UPLOAD_SCRIPT=$(find \
                  "$BITRISE_SOURCE_DIR/ios/Pods/FirebaseCrashlytics" \
                  "$BITRISE_SOURCE_DIR/ios/build" \
                  "$HOME/Library/Developer/Xcode/DerivedData" \
                  -type f -name upload-symbols 2>/dev/null | head -1)
                if [ -z "$UPLOAD_SCRIPT" ]; then
                  echo "upload-symbols not found — dSYM upload skipped"
                  exit 1
                fi
                "$UPLOAD_SCRIPT" -gsp "$GSP" -p ios "$BITRISE_DSYM_PATH"
      - firebase-app-distribution@0:
          title: Firebase Deployment - Debug IPA
          inputs:
            - app_path: "$BITRISE_IPA_PATH"
            - app: "$FIREBASE_IOS_APP_ID"
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - deploy-to-bitrise-io@2: {}
  bundle_android:
    description: Test + Debug APK/AAB, deployed to Firebase App Distribution.
    before_run:
      - _test
    after_run:
      - _deploy_android_debug
  bundle_iOS:
    description: Test + Debug iOS build (dev-signed), deployed to Firebase App Distribution.
    before_run:
      - _test
    after_run:
      - _deploy_ios_debug
  bundle_flutter:
    description: Test + Android + iOS debug builds, deployed to Firebase App Distribution.
    before_run:
      - _test
    after_run:
      - _deploy_android_debug
      - _deploy_ios_debug
  release_android:
    description: Test + Release APK/AAB, deployed to Firebase App Distribution.
    before_run:
      - _test
    steps:
      - set-java-version@1:
          inputs:
            - set_java_version: 21
      - file-downloader@1:
          title: Download release keystore zip from Bitrise Generic File Storage
          inputs:
            - source: "$BITRISEIO_ANDROID_KEYSTORE_ZIP_URL"
            - destination: "$BITRISE_SOURCE_DIR/android/keystore.zip"
      - script:
          title: Unzip keystore into android/
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex
                unzip -o "$BITRISE_SOURCE_DIR/android/keystore.zip" -d "$BITRISE_SOURCE_DIR/android/"
                rm "$BITRISE_SOURCE_DIR/android/keystore.zip"
      - flutter-build@0:
          title: Build release APK (universal)
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
            - platform: android
            - android_output_type: apk
            - android_additional_params: "--build-number=$FLUTTER_BUILD_NUM"
      - firebase-app-distribution@0:
          title: Firebase Deployment - Release APK
          inputs:
            - app_path: "$BITRISE_APK_PATH"
            - app: "$FIREBASE_ANDROID_APP_ID"
            - groups: "$SOLO_TEST"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - flutter-build@0:
          title: Build release AAB
          inputs:
            - project_location: "$BITRISE_FLUTTER_PROJECT_LOCATION"
            - platform: android
            - android_output_type: appbundle
            - android_additional_params: "--build-number=$FLUTTER_BUILD_NUM"
      - firebase-app-distribution@0:
          title: Firebase Deployment - Release AAB
          inputs:
            - app_path: "$BITRISE_AAB_PATH"
            - app: "$FIREBASE_ANDROID_APP_ID"
            - groups: "$SOLO_TEST"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - deploy-to-bitrise-io@2: {}
  release_iOS:
    description: Test + Release iOS archive (ad-hoc signed), deployed to Firebase
      App Distribution.
    before_run:
      - _test
    steps:
      - script:
          title: flutter pub get + iOS config prep
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex
                flutter pub get
                dart pub global activate flutterfire_cli
                envman add --key PATH --value "$HOME/.pub-cache/bin:$PATH"
                flutter build ios --config-only --release --build-number=$FLUTTER_BUILD_NUM
      - manage-ios-code-signing@2:
          inputs:
            - distribution_method: ad-hoc
            - apple_service_connection: api-key
            - project_path: "./ios/Runner.xcworkspace"
            - scheme: Runner
      - xcode-archive@5:
          inputs:
            - project_path: "./ios/Runner.xcworkspace"
            - scheme: Runner
            - configuration: Release
            - distribution_method: ad-hoc
            - automatic_code_signing: api-key
      - script:
          title: Upload dSYMs to Firebase Crashlytics
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -ex
                GSP="$BITRISE_SOURCE_DIR/ios/Runner/GoogleService-Info.plist"
                UPLOAD_SCRIPT=$(find \
                  "$BITRISE_SOURCE_DIR/ios/Pods/FirebaseCrashlytics" \
                  "$BITRISE_SOURCE_DIR/ios/build" \
                  "$HOME/Library/Developer/Xcode/DerivedData" \
                  -type f -name upload-symbols 2>/dev/null | head -1)
                if [ -z "$UPLOAD_SCRIPT" ]; then
                  echo "upload-symbols not found — dSYM upload skipped"
                  exit 1
                fi
                "$UPLOAD_SCRIPT" -gsp "$GSP" -p ios "$BITRISE_DSYM_PATH"
      - firebase-app-distribution@0:
          title: Firebase Deployment - Release IPA
          inputs:
            - app_path: "$BITRISE_IPA_PATH"
            - app: "$FIREBASE_IOS_APP_ID"
            - groups: "$TEST_GROUPS"
            - release_notes: "$BITRISE_GIT_MESSAGE"
            - firebase_token: "$FIREBASE_TOKEN"
      - deploy-to-bitrise-io@2: {}
meta:
  bitrise.io:
    stack: osx-xcode-26.6.x
    machine_type_id: g2.mac.large
app:
  envs:
    - opts:
        is_expand: false
      BITRISE_FLUTTER_PROJECT_LOCATION: "."
    - opts:
        is_expand: false
      FLUTTER_VERSION: 3.44.8
    - opts:
        is_expand: false
      FIREBASE_ANDROID_APP_ID: 1:645600819281:android:e618ecc14b4118c849a070
    - opts:
        is_expand: false
      FIREBASE_IOS_APP_ID: 1:645600819281:ios:c1c6acb94446b90249a070
    - opts:
        is_expand: false
      TEST_GROUPS: app-devs, qa, product
    - opts:
        is_expand: false
      SOLO_TEST: Solo
    - opts:
        is_expand: false
      _JAVA_OPTIONS: "-Xms1024m -Xmx3072m"
    - opts:
        is_expand: false
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError"
