name: hs_app_flutter
description: "HS Flutter"
publish_to: "none"

version: 14.6.0+2026073001

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Collection utilities (mapIndexed, firstWhereOrNull, groupBy, etc.)
  collection: ^1.19.1

  # Speech-bubble tooltips with a directional arrow/pointer
  super_tooltip: ^2.0.9

  # State Management - BLoC
  flutter_bloc: ^9.1.1

  # Functional Programming & Error Handling
  dartz: ^0.10.1
  equatable: ^2.0.8

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2

  # Environment Configuration
  flutter_dotenv: ^6.0.1

  # Device & Package Info
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0

  # UUID Generation
  uuid: ^4.5.3

  # Local Storage
  shared_preferences: ^2.5.5

  # Routing
  go_router: ^17.2.2

  # Image Loading & Caching
  cached_network_image: ^3.4.1

  # Grid Layout
  flutter_staggered_grid_view: ^0.7.0

  # Loading Placeholders
  shimmer: ^3.0.0

  # Viewport visibility — drives per-component impression tracking on the
  # Discover feed via HomeTrackAnalyticManager.
  visibility_detector: ^0.4.0+2

  # Firebase — coordinated release, let pub pick the latest set that matches
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.2.2
  # setUserProperty("ct_objectId", cleverTapId) parity with Android
  # HsApplication.initFirebaseUserProps line 164-173.
  firebase_analytics: ^12.4.2

  # Network Connectivity
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  flutter_svg: ^2.2.4
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.13

  #Juspay HyperSDK
  hypersdkflutter: ^4.0.55

  # SMS OTP autofill (Android: SMS User Consent API; iOS: native autofillHints)
  sms_autofill: ^2.3.3

  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  html: ^0.15.5

  logger:
    ^2.7.0

  # HTTP Inspector (debug mode only — gated with kDebugMode at runtime)
  talker_flutter: ^5.1.16
  talker_dio_logger: ^5.1.16
  talker_bloc_logger: ^5.1.17
  talker_dio_logger_plus: ^1.0.5

  # Analytics — Segment (official segmentio/analytics_flutter) + AppsFlyer +
  # CleverTap + ATT/advertising-id.
  # http is pulled in directly (also transitive via segment_analytics) — we
  # use it to build a custom requestFactory that rewrites the SDK's `/b` path
  # to the Hopscotch proxy's expected wire format with Basic Auth.
  segment_analytics: ^1.1.11
  appsflyer_sdk: ^6.16.2
  clevertap_plugin: ^3.4.0
  # Microsoft Clarity — session replays + custom tags for user_type / utm /
  # PID / PLP / boutiqueId + user id. Mirrors Android
  # `common/helper/ClarityHelper.kt`. Feature-flag gated via
  # `PrefManager.featureFlagClarity`.
  clarity_flutter: ^1.9.0
  app_tracking_transparency: ^2.0.6+1
  advertising_id: ^2.4.0
  # Android: `Settings.Secure.ANDROID_ID` reader. `device_info_plus.androidInfo.id`
  # returns `Build.ID` (OS build fingerprint), NOT ANDROID_ID — confirmed in
  # device_info_plus 13.1.0/MethodCallHandlerImpl.kt:38. Using it for hs_device_id
  # collapses all users on the same OS build into one analytics identity.
  android_id: ^0.4.0
  # iOS: Keychain-backed persistence for hs_device_id so the UUID survives app
  # uninstall (matches Android `Settings.Secure.ANDROID_ID` stability and the
  # iOS-native `DeviceUID.m` Keychain pattern).
  flutter_secure_storage: ^10.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

  # Native Splash Screen
  flutter_native_splash: ^2.4.7

  # Launcher Icons
  flutter_launcher_icons: ^0.14.4

  # Code generation
  build_runner: ^2.14.1
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.1
  freezed: ^3.2.5
  retrofit_generator: ^10.2.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/icons/dashboard/
    - assets/icons/messagebars/
    - assets/icons/legal/
    - assets/icons/pdp/
    - assets/animations/
    - assets/icons/empty_states/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
