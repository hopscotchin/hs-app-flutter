name: hs_app_flutter
description: "HS Flutter"
publish_to: "none"

version: 14.2.0+2026062301

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management - BLoC
  flutter_bloc: ^9.1.1

  # Functional Programming & Error Handling
  dartz: ^0.10.1
  equatable: ^2.0.8

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2

  # Environment Configuration
  flutter_dotenv: ^6.0.1

  # Device & Package Info
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0

  # UUID Generation
  uuid: ^4.5.3

  # Local Storage
  shared_preferences: ^2.5.5

  # Routing
  go_router: ^17.2.2

  # Image Loading & Caching
  cached_network_image: ^3.4.1

  # Grid Layout
  flutter_staggered_grid_view: ^0.7.0

  # Loading Placeholders
  shimmer: ^3.0.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.2
  firebase_messaging: ^16.2.2

  # Network Connectivity
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.4
  webview_flutter: ^4.13.1

  #Juspay HyperSDK
  hypersdkflutter: ^4.0.55

  # SMS OTP autofill (Android: SMS User Consent API; iOS: native autofillHints)
  sms_autofill: ^2.3.3

  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  html: ^0.15.5

  logger:
    ^2.7.0

  # HTTP Inspector (debug mode only — gated with kDebugMode at runtime)
  talker_flutter: ^5.1.16
  talker_dio_logger: ^5.1.16
  talker_bloc_logger: ^5.1.17
  talker_dio_logger_plus: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

  # Native Splash Screen
  flutter_native_splash: ^2.4.7

  # Launcher Icons
  flutter_launcher_icons: ^0.14.4

  # Code generation
  build_runner: ^2.14.1
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.1
  freezed: ^3.2.5
  retrofit_generator: ^10.2.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/icons/dashboard/
    - assets/icons/messagebars/
    - assets/animations/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
